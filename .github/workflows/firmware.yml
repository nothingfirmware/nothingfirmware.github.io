name: Firmware xml

on:
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Firmware Repo
        uses: actions/checkout@v4
        with:
          path: firmware-repo

      - name: Checkout Tools Repo
        uses: actions/checkout@v4
        with:
          repository: nothingtools/nothingtools.github.io
          path: tools-repo

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd firmware-repo
          npm install feed

      - name: Run Converter Script
        run: |
          cp tools-repo/update.json firmware-repo/update.json
          cd firmware-repo
          node convert.js

      - name: Commit and Push XML
        run: |
          cd firmware-repo
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add firmware.xml
          git commit -m "Auto-updated firmware.xml from Nothing Space JSON" || exit 0
          git push
